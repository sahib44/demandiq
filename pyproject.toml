[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "demandiq"
version = "0.1.0"
description = "Reproducible retail data, demand forecasting and inventory decision support"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "openpyxl==3.1.5",
  "matplotlib==3.10.1",
  "scikit-learn==1.6.1",
  "xgboost==2.1.4",
  "joblib==1.4.2",
  "fastapi==0.154.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.0.38",
  "alembic==1.14.1",
  "psycopg[binary]==3.2.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10", "black==25.1.0", "httpx==0.28.1", "httpx2==2.15.1"]

[tool.setuptools.packages.find]
include = ["ml*", "backend*"]
exclude = ["*.tests*"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires an isolated PostgreSQL TEST_DATABASE_URL"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
target-version = ["py312"]
line-length = 88
